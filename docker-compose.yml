services:

  api:
    build: .
    container_name: billlens-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - qdrant
    volumes:
      - .:/app
    command: >
      uvicorn apps.api.main:app
      --host 0.0.0.0
      --port 8000
      --reload

  postgres:
    image: postgres:16
    container_name: billlens-postgres
    environment:
      POSTGRES_USER: billlens
      POSTGRES_PASSWORD: billlens
      POSTGRES_DB: billlens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: billlens-redis
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: billlens-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
